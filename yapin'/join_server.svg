<svg xmlns="http://w3.org" width="220" height="44" viewBox="0 0 220 44" role="img" aria-label="Join Our Server on Yapin'">
  <title>Join Our Server on Yapin'</title>
  <defs>
    <style>
      @import url('https://googleapis.com');
      .label-text {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #FFFFFF;
      }
      .brand-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 15px;
        fill: #FFFFFF;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>

  <!-- Main Pill Background (Yapin' Orange) -->
  <rect x="0" y="0" width="220" height="44" rx="10" fill="#FC6A39"/>

  <!-- Subtle Inner Highlight Border (Coral) -->
  <rect x="0.75" y="0.75" width="218.5" height="42.5" rx="9.25" fill="none" stroke="#FF6B4A" stroke-width="1.5"/>

  <!-- Dark Right-Side Accent Panel (Ink) -->
  <path d="M 140 0 H 210 A 10 10 0 0 1 220 10 V 34 A 10 10 0 0 1 210 44 H 140 Z" fill="#1D1F23"/>

  <!-- White Bear Icon (Fitted to exact 20x20 slot at x=14, y=12) -->
  <g transform="translate(14, 12)">
    <!-- Ears -->
    <circle cx="4.8" cy="4.8" r="3.6" fill="#FFFFFF"/>
    <circle cx="15.2" cy="4.8" r="3.6" fill="#FFFFFF"/>
    <!-- Inner Ears (Yapin' Orange) -->
    <circle cx="4.8" cy="4.8" r="1.6" fill="#FC6A39"/>
    <circle cx="15.2" cy="4.8" r="1.6" fill="#FC6A39"/>

    <!-- Bear Head -->
    <ellipse cx="10" cy="11.2" rx="8.2" ry="7.2" fill="#FFFFFF"/>

    <!-- Eyes (Ink) -->
    <circle cx="7" cy="9.6" r="1.15" fill="#1D1F23"/>
    <circle cx="13" cy="9.6" r="1.15" fill="#1D1F23"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="10" cy="13.1" rx="3.4" ry="2.4" fill="#FFE8E0"/>

    <!-- Nose (Ink) -->
    <path d="M 8.7 12.1 Q 10 11.5 11.3 12.1 Q 11.1 13.3 10 13.6 Q 8.9 13.3 8.7 12.1 Z" fill="#1D1F23"/>

    <!-- Mouth -->
    <path d="M 10 13.5 V 14.4 M 8.8 14.3 Q 10 15.1 11.2 14.3" fill="none" stroke="#1D1F23" stroke-width="0.95" stroke-linecap="round"/>
  </g>

  <!-- Call-to-Action Text -->
  <text x="41" y="26.5" class="label-text">Join Our Server</text>

  <!-- Brand Name (Written with the required apostrophe) -->
  <text x="180" y="27" text-anchor="middle" class="brand-text">Yapin'</text>
</svg>
